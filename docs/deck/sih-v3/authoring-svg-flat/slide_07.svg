<text x="48.22" y="226.3" text-anchor="start" xml:space="preserve" font-size="24" fill="#000000" font-weight="bold"><tspan>1.   </tspan><tspan>Kindly keep the maximum slides limit up to six </tspan><tspan fill="#C00000">(6). </tspan><tspan>( Including the </tspan><tspan>title slide) </tspan></text>
<text x="48.22" y="261.23" text-anchor="start" xml:space="preserve" font-size="24" fill="#000000" font-weight="bold"><tspan>2.   </tspan><tspan>Try to avoid paragraphs and post your idea in points /diagrams / Infographics /pictures </tspan></text>
<text x="48.22" y="296.16" text-anchor="start" xml:space="preserve" font-size="24" fill="#000000" font-weight="bold"><tspan>3.   </tspan><tspan>Keep your explanation precise and easy to understand</tspan></text>
<text x="48.22" y="331.1" text-anchor="start" xml:space="preserve" font-size="24" fill="#000000" font-weight="bold"><tspan>4.   </tspan><tspan>Idea should be unique and novel. </tspan></text>
<text x="48.22" y="366.03" text-anchor="start" xml:space="preserve" font-size="24" fill="#000000" font-weight="bold"><tspan>5.   </tspan><tspan>You can only use provided </tspan><tspan>template</tspan><tspan> for making the </tspan><tspan>PPT</tspan><tspan> without changing the idea details </tspan><tspan x="48.22" dy="21.6">pointers (mentioned in previous slides).</tspan></text>
<text x="48.22" y="422.56" text-anchor="start" xml:space="preserve" font-size="24" fill="#000000" font-weight="bold"><tspan>6.   </tspan><tspan>You need to save the file in PDF and upload the same on portal. No PPT, Word Doc or any other </tspan><tspan x="48.22" dy="21.6">format will be supported.</tspan></text>

<text x="48.22" y="514.03" text-anchor="start" xml:space="preserve" font-size="24" fill="#C00000" font-weight="bold"><tspan>Note - You can delete this slide (Important Pointers) when you upload the details of your idea on </tspan><tspan x="48.22" dy="21.6">SIH portal.</tspan></text>

</g>
