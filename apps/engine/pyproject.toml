[project]
name = "drishti-engine"
version = "0.1.0"
description = "DRISHTI engine: data validation, four detection agents, risk fusion (SIH26102)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
