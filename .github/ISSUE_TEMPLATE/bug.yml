name: Bug
description: Something on the live site or in the code is wrong
title: "Bug: "
labels: ["bug", "ready"]
body:
  - type: markdown
    attributes:
      value: |
        This repo is public: no passwords, demo logins, phone numbers or people's names in here.
        Refer to works by their work ID.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: Page or command, role you were logged in as, work ID
  - type: input
    id: where
    attributes:
      label: Where
      description: live site / local / CI
